<?xml version="1.0" encoding="UTF-8"?>
<!-- MSU Esports - Picks and bans. The map cards repeat once per pool map (repeat:pool); each card shows its state. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1920" height="1080" viewBox="0 0 1920 1080">
  <sodipodi:namedview pagecolor="#303030" inkscape:pagecheckerboard="true" inkscape:document-units="px"/>
  <defs>
    <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9cdb3"/><stop offset="1" stop-color="#d9c499"/></linearGradient>
    <!-- the maroon swirl texture, stretched over each panel's box -->
    <pattern id="swirl" patternContentUnits="objectBoundingBox" width="1" height="1">
      <image href="panel-swirl.png" width="1" height="1" preserveAspectRatio="none"/>
    </pattern>
    <!-- halftone dots laid over the panels -->
    <pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7">
      <circle cx="1.75" cy="1.75" r="1.35" fill="#000"/><circle cx="5.25" cy="5.25" r="1.35" fill="#000"/>
    </pattern>
    <filter id="textShadow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.2"/><feOffset dy="1.5" result="blur"/>
      <feFlood flood-color="#12020a" flood-opacity=".9"/><feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="cardCover"><rect x="84" y="282" width="216" height="216" rx="10"/></clipPath>
  </defs>
  <g inkscape:groupmode="layer" inkscape:label="back">
    <image inkscape:label="background" href="bg-clean.png" x="0" y="0" width="1920" height="1080" preserveAspectRatio="none"/>
    <rect inkscape:label="fx:dust" x="0" y="0" width="1920" height="1080" fill="none"/>
  </g>

  <g inkscape:groupmode="layer" inkscape:label="header">
    <g inkscape:label="team-a">
      <g><path d="M150,48 H760 L742,124 H132 Z" fill="url(#swirl)" stroke="#12020a" stroke-width="1.5"/><path d="M150,48 H760 L742,124 H132 Z" fill="url(#dots)" opacity=".45"/></g>
      <path transform="translate(172 60) scale(0.09639)" fill="url(#cream)" fill-rule="evenodd" d="M-0.5,-0.5 L-0.5,408.5 L232,539 L464.5,408.5 L464.5,-0.5 L422,-0.5 L422,383.5 L232,490 L42,383.5 L42,-0.5 Z M68,-0.5 L68,206.5 L305.5,340.5 L232,381.5 L152,337 L152,288.5 L68,241.5 L68,373.5 L232,465 L396,374 L396,304.5 L152,168.5 L152,135 L232,179 L309,136.5 L309,222.5 L396,271 L396,-0.5 L232,90.5 Z"/>
      <text inkscape:label="{a.name | upper} fit:470" x="730" y="102" style="font-family:Shader;font-size:38px;letter-spacing:1px;text-anchor:end;fill:url(#cream);stroke:url(#cream);stroke-width:1.5;stroke-linejoin:miter;paint-order:stroke" filter="url(#textShadow)"><tspan>MSU MAROON</tspan></text>
    </g>
    <g inkscape:label="title">
      <g><path d="M780,40 H1140 L1122,132 H762 Z" fill="url(#swirl)" stroke="#12020a" stroke-width="1.5"/><path d="M780,40 H1140 L1122,132 H762 Z" fill="url(#dots)" opacity=".45"/></g>
      <text x="951" y="80" style="font-family:Shader;font-size:26px;letter-spacing:2px;text-anchor:middle;fill:url(#cream);stroke:url(#cream);stroke-width:1.4;stroke-linejoin:miter;paint-order:stroke" filter="url(#textShadow)"><tspan>PICKS &amp; BANS</tspan></text>
      <text inkscape:label="fit:300" x="951" y="112" style="font-family:Shader;font-size:13px;letter-spacing:1px;text-anchor:middle;fill:url(#cream);stroke:url(#cream);stroke-width:0.4;stroke-linejoin:miter;paint-order:stroke;opacity:0.8" filter="url(#textShadow)"><tspan>{header | upper}</tspan></text>
    </g>
    <g inkscape:label="team-b">
      <g><path d="M1160,48 H1770 L1752,124 H1142 Z" fill="url(#swirl)" stroke="#12020a" stroke-width="1.5"/><path d="M1160,48 H1770 L1752,124 H1142 Z" fill="url(#dots)" opacity=".45"/></g>
      <text inkscape:label="{b.name | upper} fit:470" x="1190" y="102" style="font-family:Shader;font-size:38px;letter-spacing:1px;text-anchor:start;fill:url(#cream);stroke:url(#cream);stroke-width:1.5;stroke-linejoin:miter;paint-order:stroke" filter="url(#textShadow)"><tspan>MSU WHITE</tspan></text>
      <polygon points="1712.0,60.0 1718.9,76.5 1736.7,78.0 1723.1,89.6 1727.3,107.0 1712.0,97.7 1696.7,107.0 1700.9,89.6 1687.3,78.0 1705.1,76.5" fill="url(#cream)"/>
    </g>
  </g>

  <g inkscape:groupmode="layer" inkscape:label="prompt" transform="translate(0 60)">
    <g inkscape:label="prompt-live show:picks.next">
      <text inkscape:label="#prompt-text" x="960" y="222" style="font-family:Shader;font-size:30px;letter-spacing:3px;text-anchor:middle;fill:url(#cream);stroke:url(#cream);stroke-width:1.3;stroke-linejoin:miter;paint-order:stroke" filter="url(#textShadow)"><tspan>{picks.next.byName | upper} IS {picks.next.verb | upper}</tspan></text>
    </g>
    <g inkscape:label="show:picks.done hide:match.winner" style="display:none">
      <text x="960" y="222" style="font-family:Shader;font-size:30px;letter-spacing:3px;text-anchor:middle;fill:url(#cream);stroke:url(#cream);stroke-width:1.3;stroke-linejoin:miter;paint-order:stroke" filter="url(#textShadow)"><tspan>PICKS AND BANS DONE</tspan></text>
    </g>
  </g>

  <g inkscape:groupmode="layer" inkscape:label="cards" transform="translate(0 110)">
    <g inkscape:label="repeat:pool">
      <g inkscape:label="card">
        <g><path d="M72,270 H312 V630 H72 Z" fill="url(#swirl)" stroke="#12020a" stroke-width="1.5"/><path d="M72,270 H312 V630 H72 Z" fill="url(#dots)" opacity=".45"/></g>
        <g clip-path="url(#cardCover)"><image inkscape:label="img:item.cover" x="84" y="282" width="216" height="216"/></g>
        <rect x="84" y="282" width="216" height="216" rx="10" fill="none" stroke="url(#cream)" stroke-width="1.5" opacity=".6"/>
        <text inkscape:label="{item.name | upper} fit:212" x="86" y="528" style="font-family:Shader;font-size:20px;letter-spacing:1px;text-anchor:start;fill:url(#cream);stroke:url(#cream);stroke-width:0.8;stroke-linejoin:miter;paint-order:stroke" filter="url(#textShadow)"><tspan>SONG NAME</tspan></text>
        <text inkscape:label="{item.artist} fit:212" x="86" y="554" style="font-family:Geom Graphic;font-size:15px;letter-spacing:1px;text-anchor:start;fill:url(#cream);opacity:0.85"><tspan>Artist</tspan></text>
        <text x="86" y="578" style="font-family:Geom Graphic;font-size:15px;letter-spacing:1px;text-anchor:start;fill:url(#cream);opacity:0.85"><tspan>{item.difficulty} · {item.category}</tspan></text>
        <g inkscape:label="state:item.state">
          <g inkscape:label="when:banned" style="display:none">
            <rect x="72" y="270" width="240" height="360" fill="#0a0105" opacity=".72"/>
            <path d="M110,320 L274,460 M274,320 L110,460" stroke="#c23a5a" stroke-width="10" stroke-linecap="square" opacity=".9"/>
            <text inkscape:label="fit:216" x="192" y="614" style="font-family:Shader;font-size:15px;letter-spacing:1px;text-anchor:middle;fill:url(#cream);stroke:url(#cream);stroke-width:0.7;stroke-linejoin:miter;paint-order:stroke" filter="url(#textShadow)"><tspan>BAN · {item.byName | upper}</tspan></text>
          </g>
          <g inkscape:label="when:picked" style="display:none">
            <rect x="75" y="273" width="234" height="354" fill="none" stroke="url(#cream)" stroke-width="5"/>
            <path d="M84,282 H210 L196,316 H84 Z" fill="url(#cream)"/>
            <text x="142" y="306" style="font-family:Shader;font-size:17px;text-anchor:middle;fill:#2a0510;stroke:#2a0510;stroke-width:.8;paint-order:stroke"><tspan>MAP {item.order}</tspan></text>
            <text inkscape:label="fit:216" x="192" y="614" style="font-family:Shader;font-size:15px;letter-spacing:1px;text-anchor:middle;fill:url(#cream);stroke:url(#cream);stroke-width:0.7;stroke-linejoin:miter;paint-order:stroke" filter="url(#textShadow)"><tspan>PICK · {item.byName | upper}</tspan></text>
          </g>
          <g inkscape:label="when:tiebreaker" style="display:none">
            <path d="M84,282 H290 L276,316 H84 Z" fill="url(#cream)"/>
            <text x="183" y="305" style="font-family:Shader;font-size:15px;text-anchor:middle;fill:#2a0510;stroke:#2a0510;stroke-width:.8;paint-order:stroke"><tspan>TIEBREAKER</tspan></text>
          </g>
          <g inkscape:label="when:current" style="display:none">
            <rect inkscape:label="now-glow" x="75" y="273" width="234" height="354" fill="none" stroke="url(#cream)" stroke-width="7"/>
            <text inkscape:label="fit:216" x="192" y="614" style="font-family:Shader;font-size:15px;letter-spacing:2px;text-anchor:middle;fill:url(#cream);stroke:url(#cream);stroke-width:0.9;stroke-linejoin:miter;paint-order:stroke" filter="url(#textShadow)"><tspan>NOW PLAYING</tspan></text>
          </g>
          <g inkscape:label="when:played" style="display:none">
            <rect x="72" y="270" width="240" height="360" fill="#0a0105" opacity=".45"/>
            <text inkscape:label="fit:216" x="192" y="614" style="font-family:Shader;font-size:15px;letter-spacing:1px;text-anchor:middle;fill:url(#cream);stroke:url(#cream);stroke-width:0.7;stroke-linejoin:miter;paint-order:stroke" filter="url(#textShadow)"><tspan>WON · {item.winnerName | upper}</tspan></text>
          </g>
          <g inkscape:label="when:available"/>
        </g>
      </g>
    </g>
  </g>

  <g inkscape:groupmode="layer" inkscape:label="steps" transform="translate(0 130)">
    <g inkscape:label="repeat:picks.steps">
      <g inkscape:label="step">
        <path d="M72,700 H186 L178,736 H64 Z" fill="#1a0309" stroke="#5e0c23" stroke-width="2"/>
        <path inkscape:label="show:item.done" d="M72,700 H186 L178,736 H64 Z" fill="url(#cream)" style="display:none"/>
        <path inkscape:label="show:item.current #step-now" d="M72,700 H186 L178,736 H64 Z" fill="none" stroke="url(#cream)" stroke-width="3" style="display:none"/>
        <text inkscape:label="hide:item.done" x="125" y="725" style="font-family:Shader;font-size:16px;letter-spacing:1px;text-anchor:middle;fill:#d9cdb3"><tspan>{item.type | upper}</tspan></text>
        <text inkscape:label="show:item.done" x="125" y="725" style="display:none;font-family:Shader;font-size:16px;letter-spacing:1px;text-anchor:middle;fill:#2a0510"><tspan>{item.type | upper}</tspan></text>
        <rect inkscape:label="color:item.by" x="70" y="742" width="108" height="5" rx="2" fill="#d9cdb3"/>
      </g>
    </g>
  </g>
</svg>
