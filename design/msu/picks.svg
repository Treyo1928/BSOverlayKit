<?xml version="1.0" encoding="UTF-8"?>
<!-- MSU Esports - Picks and bans. The map cards repeat once per pool map (repeat:pool); each card shows its state. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1920" height="1080" viewBox="0 0 1920 1080">
  <sodipodi:namedview pagecolor="#303030" inkscape:pagecheckerboard="true" inkscape:document-units="px"/>
  <defs>
    <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9cdb3"/><stop offset="1" stop-color="#d9c499"/></linearGradient>
    <!-- frosted glass: a shape named "glass" shows the background blurred behind its own fill (docs/DESIGNING.md).
         These are the tints: neutral, team A (maroon) and team B (cream), and the light edge. -->
    <linearGradient id="glassTint" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6e3d6" stop-opacity=".17"/><stop offset="1" stop-color="#3a0816" stop-opacity=".34"/></linearGradient>
    <linearGradient id="glassMaroon" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a01c3c" stop-opacity=".74"/><stop offset="1" stop-color="#5e0c23" stop-opacity=".8"/></linearGradient>
    <linearGradient id="glassCream" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7f0df" stop-opacity=".9"/><stop offset="1" stop-color="#e4d6b6" stop-opacity=".86"/></linearGradient>
    <linearGradient id="glassEdge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3dc" stop-opacity=".6"/><stop offset="1" stop-color="#fff3dc" stop-opacity=".12"/></linearGradient>
    <!-- halftone dots laid over the panels -->
    <pattern id="dots" patternUnits="userSpaceOnUse" width="7" height="7">
      <circle cx="1.75" cy="1.75" r="1.35" fill="#000"/><circle cx="5.25" cy="5.25" r="1.35" fill="#000"/>
    </pattern>
    <filter id="textShadow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.2"/><feOffset dy="1.5" result="blur"/>
      <feFlood flood-color="#12020a" flood-opacity=".9"/><feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="cardCover"><rect x="84" y="282" width="216" height="216" rx="10"/></clipPath>
  </defs>
  <g inkscape:groupmode="layer" inkscape:label="back">
    <image inkscape:label="background" href="bg-clean.png" x="0" y="0" width="1920" height="1080" preserveAspectRatio="none"/>
    <rect inkscape:label="fx:dust" x="0" y="0" width="1920" height="1080" fill="none"/>
  </g>

  <g inkscape:groupmode="layer" inkscape:label="header">
    <g inkscape:label="team-a">
      <path inkscape:label="glass" d="M150,48 H760 L742,124 H132 Z" fill="url(#glassMaroon)" stroke="url(#glassEdge)" stroke-width="1.5"/>
      <g inkscape:label="state:a.logoKind"><g inkscape:label="when:msu"><path transform="translate(172.00 60.00) scale(0.09639)" fill="url(#cream)" fill-rule="evenodd" d="M-0.5,-0.5 L-0.5,408.5 L232,539 L464.5,408.5 L464.5,-0.5 L422,-0.5 L422,383.5 L232,490 L42,383.5 L42,-0.5 Z M68,-0.5 L68,206.5 L305.5,340.5 L232,381.5 L152,337 L152,288.5 L68,241.5 L68,373.5 L232,465 L396,374 L396,304.5 L152,168.5 L152,135 L232,179 L309,136.5 L309,222.5 L396,271 L396,-0.5 L232,90.5 Z"/></g><g inkscape:label="when:image" style="display:none"><image inkscape:label="img:a.logo" x="168.4" y="60.0" width="52.1" height="52.1" preserveAspectRatio="xMidYMid meet"/></g><g inkscape:label="when:else" style="display:none"><polygon points="194.4,61.6 200.5,79.2 219.2,79.5 204.3,90.8 209.7,108.6 194.4,98.0 179.1,108.6 184.5,90.8 169.7,79.5 188.3,79.2" fill="url(#cream)"/></g></g>
      <text inkscape:label="{a.name | upper} fit:470" x="730" y="102" style="font-family:Shader;font-size:38px;letter-spacing:1px;text-anchor:end;fill:url(#cream);stroke:url(#cream);stroke-width:1.5;stroke-linejoin:miter;paint-order:stroke" filter="url(#textShadow)"><tspan>MSU MAROON</tspan></text>
    </g>
    <g inkscape:label="title">
      <path inkscape:label="glass" d="M780,40 H1140 L1122,132 H762 Z" fill="url(#glassTint)" stroke="url(#glassEdge)" stroke-width="1.5"/>
      <text inkscape:label="hide:match.winner" x="951" y="66" style="font-family:Shader;font-size:15px;letter-spacing:3px;text-anchor:middle;fill:url(#cream);stroke:url(#cream);stroke-width:0.5;stroke-linejoin:miter;paint-order:stroke;opacity:0.9" filter="url(#textShadow)"><tspan>PICKS &amp; BANS</tspan></text>
      <text inkscape:label="show:match.winner" x="951" y="66" style="display:none;font-family:Shader;font-size:15px;letter-spacing:3px;text-anchor:middle;fill:url(#cream);stroke:url(#cream);stroke-width:0.5;stroke-linejoin:miter;paint-order:stroke;opacity:0.9" filter="url(#textShadow)"><tspan>FINAL SCORE</tspan></text>
      <rect x="856" y="80" width="12" height="36" fill="#b3233f" stroke="url(#cream)" stroke-width="1"/>
      <text inkscape:label="{a.points} #points-a" x="910" y="118" style="font-family:Shader;font-size:46px;letter-spacing:1px;text-anchor:middle;fill:url(#cream);stroke:url(#cream);stroke-width:1.66;stroke-linejoin:miter;paint-order:stroke" filter="url(#textShadow)"><tspan>0</tspan></text>
      <text x="951" y="113" style="font-family:Shader;font-size:30px;letter-spacing:1px;text-anchor:middle;fill:url(#cream);stroke:url(#cream);stroke-width:1.08;stroke-linejoin:miter;paint-order:stroke" filter="url(#textShadow)"><tspan>-</tspan></text>
      <text inkscape:label="{b.points} #points-b" x="992" y="118" style="font-family:Shader;font-size:46px;letter-spacing:1px;text-anchor:middle;fill:url(#cream);stroke:url(#cream);stroke-width:1.66;stroke-linejoin:miter;paint-order:stroke" filter="url(#textShadow)"><tspan>0</tspan></text>
      <rect x="1034" y="80" width="12" height="36" fill="#f2ead8"/>
    </g>
    <g inkscape:label="team-b">
      <path inkscape:label="glass" d="M1160,48 H1770 L1752,124 H1142 Z" fill="url(#glassCream)" stroke="url(#glassEdge)" stroke-width="1.5"/>
      <text inkscape:label="{b.name | upper} fit:470" x="1190" y="102" style="font-family:Shader;font-size:38px;letter-spacing:1px;text-anchor:start;fill:#2a0510;stroke:#2a0510;stroke-width:1.5;stroke-linejoin:miter;paint-order:stroke"><tspan>MSU WHITE</tspan></text>
      <g inkscape:label="state:b.logoKind"><g inkscape:label="when:msu"><path transform="translate(1689.63 58.44) scale(0.09623)" fill="#2a0510" fill-rule="evenodd" d="M-0.5,-0.5 L-0.5,408.5 L232,539 L464.5,408.5 L464.5,-0.5 L422,-0.5 L422,383.5 L232,490 L42,383.5 L42,-0.5 Z M68,-0.5 L68,206.5 L305.5,340.5 L232,381.5 L152,337 L152,288.5 L68,241.5 L68,373.5 L232,465 L396,374 L396,304.5 L152,168.5 L152,135 L232,179 L309,136.5 L309,222.5 L396,271 L396,-0.5 L232,90.5 Z"/></g><g inkscape:label="when:image" style="display:none"><image inkscape:label="img:b.logo" x="1686.0" y="58.4" width="52.0" height="52.0" preserveAspectRatio="xMidYMid meet"/></g><g inkscape:label="when:else" style="display:none"><polygon points="1712.0,60.0 1718.1,77.6 1736.7,78.0 1721.9,89.2 1727.3,107.0 1712.0,96.4 1696.7,107.0 1702.1,89.2 1687.3,78.0 1705.9,77.6" fill="#2a0510"/></g></g>
    </g>
  </g>

  <g inkscape:groupmode="layer" inkscape:label="event">
    <text inkscape:label="fit:700" x="960" y="160" style="font-family:Shader;font-size:13px;letter-spacing:3px;text-anchor:middle;fill:url(#cream);stroke:url(#cream);stroke-width:0.3;stroke-linejoin:miter;paint-order:stroke;opacity:0.75" filter="url(#textShadow)"><tspan>{header | upper} · BEST OF {match.bestOf}</tspan></text>
  </g>

  <g inkscape:groupmode="layer" inkscape:label="prompt" transform="translate(0 60)">
    <g inkscape:label="prompt-live show:picks.next">
      <text inkscape:label="#prompt-text" x="960" y="222" style="font-family:Shader;font-size:30px;letter-spacing:3px;text-anchor:middle;fill:url(#cream);stroke:url(#cream);stroke-width:1.3;stroke-linejoin:miter;paint-order:stroke" filter="url(#textShadow)"><tspan>{picks.next.byName | upper} IS {picks.next.verb | upper}</tspan></text>
    </g>
    <!-- after the picks: what the match is doing (the next map, the map being played, who took the last one) -->
    <g inkscape:label="hide:picks.next">
      <g inkscape:label="state:match.phase">
        <g inkscape:label="when:waiting|loading">
          <text inkscape:label="fit:1400" x="960" y="222" style="font-family:Shader;font-size:30px;letter-spacing:3px;text-anchor:middle;fill:url(#cream);stroke:url(#cream);stroke-width:1.08;stroke-linejoin:miter;paint-order:stroke" filter="url(#textShadow)"><tspan>UP NEXT · MAP {match.mapNumber} · {map.name | upper}</tspan></text>
        </g>
        <g inkscape:label="when:playing" style="display:none">
          <text inkscape:label="fit:1400" x="960" y="222" style="font-family:Shader;font-size:30px;letter-spacing:3px;text-anchor:middle;fill:url(#cream);stroke:url(#cream);stroke-width:1.08;stroke-linejoin:miter;paint-order:stroke" filter="url(#textShadow)"><tspan>NOW PLAYING · MAP {match.mapNumber} · {map.name | upper}</tspan></text>
        </g>
        <g inkscape:label="when:finished" style="display:none">
          <text inkscape:label="fit:1400" x="960" y="222" style="font-family:Shader;font-size:30px;letter-spacing:3px;text-anchor:middle;fill:url(#cream);stroke:url(#cream);stroke-width:1.08;stroke-linejoin:miter;paint-order:stroke" filter="url(#textShadow)"><tspan>{last.winnerName | upper} TAKES MAP {last.index}</tspan></text>
        </g>
      </g>
    </g>
  </g>

  <!-- the match is decided: who won, in the winner's colours (the score is in the title box) -->
  <g inkscape:groupmode="layer" inkscape:label="winner show:match.winner" style="display:none">
    <g inkscape:label="state:match.winner">
      <g inkscape:label="when:a">
        <path inkscape:label="glass" d="M500,196 H1444 L1420,340 H476 Z" fill="url(#glassMaroon)" stroke="url(#glassEdge)" stroke-width="2"/>
        <text x="960" y="236" style="font-family:Geom Graphic;font-size:18px;letter-spacing:8px;text-anchor:middle;fill:url(#cream);opacity:0.9"><tspan>MATCH WINNER</tspan></text>
        <g inkscape:label="state:a.logoKind"><g inkscape:label="when:msu"><path transform="translate(530.00 232.00) scale(0.14087)" fill="url(#cream)" fill-rule="evenodd" d="M-0.5,-0.5 L-0.5,408.5 L232,539 L464.5,408.5 L464.5,-0.5 L422,-0.5 L422,383.5 L232,490 L42,383.5 L42,-0.5 Z M68,-0.5 L68,206.5 L305.5,340.5 L232,381.5 L152,337 L152,288.5 L68,241.5 L68,373.5 L232,465 L396,374 L396,304.5 L152,168.5 L152,135 L232,179 L309,136.5 L309,222.5 L396,271 L396,-0.5 L232,90.5 Z"/></g><g inkscape:label="when:image" style="display:none"><image inkscape:label="img:a.logo" x="524.7" y="232.0" width="76.1" height="76.1" preserveAspectRatio="xMidYMid meet"/></g><g inkscape:label="when:else" style="display:none"><polygon points="562.8,234.3 571.7,260.0 598.9,260.6 577.2,277.0 585.1,303.1 562.8,287.5 540.4,303.1 548.3,277.0 526.6,260.6 553.8,260.0" fill="url(#cream)"/></g></g>
        <text inkscape:label="{match.winnerName | upper} fit:700" x="960" y="310" style="font-family:Shader;font-size:62px;letter-spacing:2px;text-anchor:middle;fill:url(#cream);stroke:url(#cream);stroke-width:2.23;stroke-linejoin:miter;paint-order:stroke" filter="url(#textShadow)"><tspan>MSU MAROON</tspan></text>
      </g>
      <g inkscape:label="when:b" style="display:none">
        <path inkscape:label="glass" d="M500,196 H1444 L1420,340 H476 Z" fill="url(#glassCream)" stroke="url(#glassEdge)" stroke-width="2"/>
        <text x="960" y="236" style="font-family:Geom Graphic;font-size:18px;letter-spacing:8px;text-anchor:middle;fill:#2a0510;opacity:0.9"><tspan>MATCH WINNER</tspan></text>
        <g inkscape:label="state:b.logoKind"><g inkscape:label="when:msu"><path transform="translate(1319.30 227.72) scale(0.14065)" fill="#2a0510" fill-rule="evenodd" d="M-0.5,-0.5 L-0.5,408.5 L232,539 L464.5,408.5 L464.5,-0.5 L422,-0.5 L422,383.5 L232,490 L42,383.5 L42,-0.5 Z M68,-0.5 L68,206.5 L305.5,340.5 L232,381.5 L152,337 L152,288.5 L68,241.5 L68,373.5 L232,465 L396,374 L396,304.5 L152,168.5 L152,135 L232,179 L309,136.5 L309,222.5 L396,271 L396,-0.5 L232,90.5 Z"/></g><g inkscape:label="when:image" style="display:none"><image inkscape:label="img:b.logo" x="1314.0" y="227.7" width="76.0" height="76.0" preserveAspectRatio="xMidYMid meet"/></g><g inkscape:label="when:else" style="display:none"><polygon points="1352.0,230.0 1360.9,255.7 1388.1,256.2 1366.4,272.7 1374.3,298.7 1352.0,283.2 1329.7,298.7 1337.6,272.7 1315.9,256.2 1343.1,255.7" fill="#2a0510"/></g></g>
        <text inkscape:label="{match.winnerName | upper} fit:700" x="960" y="310" style="font-family:Shader;font-size:62px;letter-spacing:2px;text-anchor:middle;fill:#2a0510;stroke:#2a0510;stroke-width:2.23;stroke-linejoin:miter;paint-order:stroke"><tspan>MSU WHITE</tspan></text>
      </g>
    </g>
  </g>

  <g inkscape:groupmode="layer" inkscape:label="cards" transform="translate(0 110)">
    <g inkscape:label="repeat:pool">
      <g inkscape:label="card">
        <path inkscape:label="glass" d="M72,270 H312 V630 H72 Z" fill="url(#glassTint)" stroke="url(#glassEdge)" stroke-width="1.5"/>
        <g clip-path="url(#cardCover)"><image inkscape:label="img:item.cover" x="84" y="282" width="216" height="216"/></g>
        <rect x="84" y="282" width="216" height="216" rx="10" fill="none" stroke="url(#cream)" stroke-width="1.5" opacity=".6"/>
        <text inkscape:label="{item.name | upper} fit:212" x="86" y="528" style="font-family:Shader;font-size:20px;letter-spacing:1px;text-anchor:start;fill:url(#cream);stroke:url(#cream);stroke-width:0.8;stroke-linejoin:miter;paint-order:stroke" filter="url(#textShadow)"><tspan>SONG NAME</tspan></text>
        <text inkscape:label="{item.artist} fit:212" x="86" y="554" style="font-family:Geom Graphic;font-size:15px;letter-spacing:1px;text-anchor:start;fill:url(#cream);opacity:0.85"><tspan>Artist</tspan></text>
        <text inkscape:label="show:item.category" x="86" y="578" style="font-family:Geom Graphic;font-size:15px;letter-spacing:1px;text-anchor:start;fill:url(#cream);opacity:0.85"><tspan>{item.difficulty} · {item.category}</tspan></text>
        <text inkscape:label="hide:item.category" x="86" y="578" style="font-family:Geom Graphic;font-size:15px;letter-spacing:1px;text-anchor:start;fill:url(#cream);opacity:0.85"><tspan>{item.difficulty}</tspan></text>
        <g inkscape:label="state:item.state">
          <g inkscape:label="when:banned" style="display:none">
            <rect x="72" y="270" width="240" height="360" fill="#0a0105" opacity=".72"/>
            <path d="M110,320 L274,460 M274,320 L110,460" stroke="#c23a5a" stroke-width="10" stroke-linecap="square" opacity=".9"/>
            <text inkscape:label="fit:216" x="192" y="614" style="font-family:Shader;font-size:15px;letter-spacing:1px;text-anchor:middle;fill:url(#cream);stroke:url(#cream);stroke-width:0.7;stroke-linejoin:miter;paint-order:stroke" filter="url(#textShadow)"><tspan>BAN · {item.byName | upper}</tspan></text>
          </g>
          <g inkscape:label="when:picked" style="display:none">
            <rect x="75" y="273" width="234" height="354" fill="none" stroke="url(#cream)" stroke-width="5"/>
            <path d="M84,282 H210 L196,316 H84 Z" fill="url(#cream)"/>
            <text x="142" y="306" style="font-family:Shader;font-size:17px;text-anchor:middle;fill:#2a0510;stroke:#2a0510;stroke-width:.8;paint-order:stroke"><tspan>MAP {item.order}</tspan></text>
            <text inkscape:label="fit:216" x="192" y="614" style="font-family:Shader;font-size:15px;letter-spacing:1px;text-anchor:middle;fill:url(#cream);stroke:url(#cream);stroke-width:0.7;stroke-linejoin:miter;paint-order:stroke" filter="url(#textShadow)"><tspan>PICK · {item.byName | upper}</tspan></text>
          </g>
          <g inkscape:label="when:tiebreaker" style="display:none">
            <path d="M84,282 H290 L276,316 H84 Z" fill="url(#cream)"/>
            <text x="183" y="305" style="font-family:Shader;font-size:15px;text-anchor:middle;fill:#2a0510;stroke:#2a0510;stroke-width:.8;paint-order:stroke"><tspan>TIEBREAKER</tspan></text>
          </g>
          <g inkscape:label="when:current" style="display:none">
            <rect inkscape:label="now-glow" x="75" y="273" width="234" height="354" fill="none" stroke="url(#cream)" stroke-width="7"/>
            <g inkscape:label="state:match.phase">
              <g inkscape:label="when:playing" style="display:none"><text inkscape:label="fit:216" x="192" y="614" style="font-family:Shader;font-size:15px;letter-spacing:2px;text-anchor:middle;fill:url(#cream);stroke:url(#cream);stroke-width:0.9;stroke-linejoin:miter;paint-order:stroke" filter="url(#textShadow)"><tspan>NOW PLAYING</tspan></text></g>
              <g inkscape:label="when:else"><text inkscape:label="fit:216" x="192" y="614" style="font-family:Shader;font-size:15px;letter-spacing:2px;text-anchor:middle;fill:url(#cream);stroke:url(#cream);stroke-width:0.9;stroke-linejoin:miter;paint-order:stroke" filter="url(#textShadow)"><tspan>UP NEXT</tspan></text></g>
            </g>
          </g>
          <g inkscape:label="when:played" style="display:none">
            <rect x="72" y="270" width="240" height="360" fill="#0a0105" opacity=".45"/>
            <text inkscape:label="fit:216" x="192" y="614" style="font-family:Shader;font-size:15px;letter-spacing:1px;text-anchor:middle;fill:url(#cream);stroke:url(#cream);stroke-width:0.7;stroke-linejoin:miter;paint-order:stroke" filter="url(#textShadow)"><tspan>WON · {item.winnerName | upper}</tspan></text>
            <rect inkscape:label="color:item.winner" x="72" y="624" width="240" height="6" fill="#d9cdb3"/>
          </g>
          <g inkscape:label="when:available"/>
        </g>
      </g>
    </g>
  </g>

  <g inkscape:groupmode="layer" inkscape:label="steps" transform="translate(0 130)">
    <g inkscape:label="repeat:picks.steps">
      <g inkscape:label="step">
        <path d="M907,700 H1021 L1013,736 H899 Z" fill="#1a0309" stroke="#5e0c23" stroke-width="2"/>
        <path inkscape:label="show:item.done" d="M907,700 H1021 L1013,736 H899 Z" fill="url(#cream)" style="display:none"/>
        <path inkscape:label="show:item.current #step-now" d="M907,700 H1021 L1013,736 H899 Z" fill="none" stroke="url(#cream)" stroke-width="3" style="display:none"/>
        <text inkscape:label="hide:item.done" x="960" y="725" style="font-family:Shader;font-size:16px;letter-spacing:1px;text-anchor:middle;fill:#d9cdb3"><tspan>{item.type | upper}</tspan></text>
        <text inkscape:label="show:item.done" x="960" y="725" style="display:none;font-family:Shader;font-size:16px;letter-spacing:1px;text-anchor:middle;fill:#2a0510"><tspan>{item.type | upper}</tspan></text>
        <rect inkscape:label="color:item.by" x="905" y="742" width="108" height="5" rx="2" fill="#d9cdb3"/>
      </g>
    </g>
  </g>
</svg>
