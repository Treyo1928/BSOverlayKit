# Rules for match.svg (MSU). Two layouts: 'solo' for 1v1s, 'team' for 2 players a side (match.solo decides).
enter:
  - { target: team-a, play: slideRight }
  - { target: team-b, play: slideLeft }
  - { target: score, play: slideDown, delay: 100 }
  - { target: stats, play: slideUp, delay: 250 }
  - { target: centre, play: slideUp, delay: 350 }
  - { target: player-a, play: slideRight, delay: 300 }
  - { target: player-b, play: slideLeft, delay: 300 }
  - { target: song-team, play: fadeIn, delay: 350 }
  - { target: totals, play: fadeIn, delay: 450 }
  - { target: winbar, play: fadeIn, delay: 400 }
  - { target: winbar-solo, play: fadeIn, delay: 400 }

on:
  increase:a.points:
    - { target: points-a, play: popIn }
  increase:b.points:
    - { target: points-b, play: popIn }
  increase:a.misses:
    - { target: misses-a, play: pulse }
  increase:b.misses:
    - { target: misses-b, play: pulse }
  becomes:diff>0:                 # team A takes the lead (by accuracy)
    - { target: lead-a, play: popIn }
    - { target: acc-a-team, play: pulse }
  becomes:diff<0:
    - { target: lead-b, play: popIn }
    - { target: acc-b-team, play: pulse }
  mapStart:
    - { target: song-info, play: slideUp }
  mapEnd:
    - { target: result, play: popIn }
    - { target: result-team, play: popIn }

loop:
  - { target: pip-now, keyframes: [ { opacity: 1 }, { opacity: 0.45 }, { opacity: 1 } ], duration: 1600, easing: ease-in-out }

repeat:
  maps: { dx: 76, center: true, over: { 5: { dx: 66, scale: 0.86 } } }   # a best of 7 (finals): smaller pips, so seven fit
  #   # one pip per map of the series, centred under the score
  a.players: { dy: 505 }           # team layout: the second player's numbers sit on the second video
  b.players: { dy: 505 }

fx:
  dust: { amount: 0.5, clouds: 0.3 }

tween: 250
