# BSOverlayKit — MSU Esports overlay. Saved changes apply immediately (no restart).
# The generic starter scenes are in overlay.starter.yaml:  OVERLAY=overlay.starter.yaml ./run.sh

title: MSU Esports Beat Saber

# The event text in the Match scene's top bar (the panel can change it during the show).
header: MSU Beat Saber · Winter Session

# The hit-score look (a HitScoreVisualizer config, a file in design/) every replay on stream is drawn with.
# Leave out to show each replay with the scores its player recorded it with.
hsv: msu/MSU-HSV.json

# How far behind the players their live replays are shown during a TA match. This is the buffer: replay data that
# arrives late (a busy game, wifi on a Quest) is ridden out instead of freezing the picture and cutting the music.
# Lower = closer to live, more freezes. The four players are on the same beat whatever this is.
liveDelay: 2500ms

# Scenes, in the order the panel shows them. svg: is the file in design/ without .svg.
scenes:
  - starting: { svg: msu/starting, label: "Starting Soon" }
  - intermission: { svg: msu/intermission, label: "Intermission" }
  - brb: { svg: msu/brb, label: "Be Right Back" }
  - casters: { svg: msu/casters, label: "Casters" }
  - picks: { svg: msu/picks, label: "Picks & Bans" }
  # replays: players = its replay box shows someone who is about to play (the other scenes play the break mix)
  - ready: { svg: msu/ready, label: "Getting Ready", replays: players }
  - match: { svg: msu/match, label: "Match" }
  - bracket: { svg: msu/bracket, label: "Bracket" }
  - final: { svg: msu/final, label: "Final" }

# Side colours, used by color:a / color:b / color:item.winner in the designs.
colors:
  a: "#b3233f"
  b: "#f2ead8"

crossfade: 450

source: sim

# What the simulator calls things, so previews look like our event.
sim:
  tournament: MSU Esports Beat Saber
  short: MSU
  round: Quarterfinal 1
  a: MSU Maroon
  b: MSU White
  players: 2                     # players per map: 1 = a 1v1, 2 = duos
  # maps: 11                     # a finals pool: 11 maps, 6 picks and 4 bans, best of 7 (needs a restart)
  rosterA: [Erin, Trey, Mia, Will]
  rosterB: [Kaiden, Kadence, Alex, Wyatt]

# The whiteboard the casters draw on from the panel: where it sits on the 1920 x 1080 stream. It is over every scene;
# this place is under the casters on the Casters scene, beside the replay.
whiteboard: { x: 50, y: 575, width: 890, height: 470 }

# Automatic scene switching (the panel's Auto-switch box). when: = only from these scenes; after: = wait first;
# fade: = this switch's own crossfade.
automation:
  - { on: matchStart, scene: picks, when: "starting, intermission, brb, casters, bracket, final" }
  # A map is up next (nothing left to pick or ban before it): on to Getting Ready, which shows the map and the two
  # lineups while the players load in.
  #   picked just now: 3 seconds after the pick, long enough to see what was picked.
  #   already chosen when the map before it ended: once that map's result has been on Picks & Bans for 6 seconds
  #   (stay: how long the scene being left must have been up).
  - { on: mapNext, why: pick, scene: ready, after: 3s, when: "picks" }
  - { on: mapNext, why: result, scene: ready, after: 3s, stay: 6s, when: "picks" }
  # players are actually playing (not the organiser's start request, not "loading")
  - { on: mapStart, scene: match, when: "starting, intermission, brb, casters, picks, bracket, final" }
  - { on: mapStart, scene: match, when: "ready", fade: 200ms }   # Getting Ready: a quick cut the moment they play
  # The song is over (everyone finished, or the map closed): straight to Picks & Bans. "3s" is liveDelay (2.5 s: the
  # replays on screen are that far behind the players, so the last notes are still being shown) plus half a second.
  # Change the two together. The video boxes keep their last frame until the scene has changed.
  - { on: songEnd, scene: picks, after: 3s, when: "match" }
  - { on: mapEnd, scene: picks, after: 3s, when: "match" }
  # the match is decided (the site completed it, or one side has the maps it needs): Picks & Bans shows the winner
  # and the final score for a few seconds, then Final.
  - { on: matchEnd, scene: final, after: 12s, when: "match, picks, ready" }
