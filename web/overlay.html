<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Overlay</title>
<style>
  /* The engine's own plumbing. Designs never need CSS: they come from the SVG files. */
  html, body { position: relative; width: 1920px; height: 1080px; margin: 0; overflow: hidden; background: transparent; }
  html:has(body.preview-bg) { background: #000; }   /* a browser window bigger than the 1920×1080 page */
  body.preview-bg { background: #111 repeating-conic-gradient(#1a1a1a 0 25%, #222 0 50%) 0 0 / 40px 40px; }
  #back, #feeds, #front { position: absolute; inset: 0; }
  .scene-svg { position: absolute; left: 0; top: 0; opacity: 0; transition: opacity var(--fade, 400ms) ease; overflow: visible; }
  .scene-svg.active { opacity: 1; }
  .feed { position: absolute; overflow: hidden; opacity: 0; background: #000;
    transition: opacity .45s, left .6s cubic-bezier(.2,.8,.2,1), top .6s cubic-bezier(.2,.8,.2,1), width .6s cubic-bezier(.2,.8,.2,1), height .6s cubic-bezier(.2,.8,.2,1); }
  .feed.shown { opacity: 1; }
  .feed iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  /* a pooled replay viewer: a dark panel until its replay is in, then the replay fades in */
  .feed.viewer { background: #12020a; }
  .feed.viewer iframe { opacity: 0; transition: opacity .35s ease; }
  .feed.viewer.ready iframe { opacity: 1; }
  .feed.multiview { opacity: 1; background: transparent; pointer-events: none; }
  /* the whiteboard: over every scene, so a drawing stays through scene changes. Its place comes from overlay.yaml */
  #board { position: absolute; box-sizing: border-box; border: 4px solid #d9c9a3; border-radius: 16px; overflow: hidden; pointer-events: none;
    background: linear-gradient(#2a0711f2, #12020af2); box-shadow: 0 18px 50px #000a, inset 0 0 0 1px #0008;
    opacity: 0; transform: translateY(18px) scale(.97);
    transition: opacity .35s ease, transform .35s cubic-bezier(.2,.8,.2,1), left .5s cubic-bezier(.2,.8,.2,1), top .5s cubic-bezier(.2,.8,.2,1), width .5s cubic-bezier(.2,.8,.2,1), height .5s cubic-bezier(.2,.8,.2,1); }
  #board.open { opacity: 1; transform: none; }
  #board canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #debug { position: absolute; left: 10px; bottom: 10px; max-width: 1100px; font: 600 18px system-ui; color: #fff; background: #b00020e0; padding: 8px 12px; border-radius: 6px; display: none; white-space: pre-wrap; z-index: 9; }
  body.offline::after { content: ""; position: absolute; right: 8px; top: 8px; width: 10px; height: 10px; border-radius: 50%; background: #f33; }
</style>
</head>
<body>
  <div id="back"></div>
  <div id="feeds"></div>
  <div id="front"></div>
  <div id="board"><canvas></canvas></div>
  <div id="debug"></div>
  <script type="module" src="/overlay.js"></script>
</body>
</html>
